services:
  scylla:
    image: scylladb/scylla
    container_name: meMessageScylla
    restart: unless-stopped
    command: --smp 1 --memory 750M --overprovisioned 1
    volumes:
      - scylla-data:/var/lib/scylla
    networks:
      - meMessages-net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  meMessages:
    image:  ghcr.io/canureal/memessages:main
    restart: unless-stopped
    ports:
      - "4444:4444"
    environment:
      - CQL_HOSTS=${CQL_HOSTS}
      - CQL_KEYSPACE=${CQL_KEYSPACE}
    depends_on:
      scylla:
        condition: service_healthy
    networks:
      - meMessages-net

volumes:
  scylla-data:

networks:
  meMessages-net:
    driver: bridge
